version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=3000
      - DATABASE_URL=mysql://user:password@mysql:3306/order_management
      - JWT_SECRET=your_jwt_secret_key
      - JWT_EXPIRES_IN=1d
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        pnpm prisma migrate deploy &&
        pnpm start:prod
      "
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=order_management
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: 